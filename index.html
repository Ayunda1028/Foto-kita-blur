<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamera Blur via Gestur Dua Jari</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-color: #121212;
      color: #fff;
    }

    .container {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 300px;
      margin-top: 15px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.3s ease;
      transform: scaleX(-1); 
    }

    .blurred {
      filter: blur(15px);
    }

    .status-badge {
      font-size: 14px;
      font-weight: bold;
      padding: 8px;
      border-radius: 6px;
      background: #333;
      margin-top: 10px;
      color: #ffca28;
    }

    .controls {
      margin-top: 15px;
    }

    button {
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    canvas {
      width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin-top: 15px;
      background-color: #000;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Kamera Gestur Tangan</h2>
    <p style="font-size: 13px; color: #ccc;">Arahkan dua jari (telunjuk & tengah) ke kamera untuk memberi efek blur.</p>
    
    <div class="status-badge" id="gestureStatus">Status Tangan: Tidak Terdeteksi</div>

    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline></video>
    </div>

    <div class="controls">
      <button id="captureBtn">Ambil Foto</button>
    </div>

    <h3>Hasil Jepretan:</h3>
    <canvas id="photoCanvas"></canvas>
  </div>

  <script>
    const webcam = document.getElementById('webcam');
    const captureBtn = document.getElementById('captureBtn');
    const canvas = document.getElementById('photoCanvas');
    const gestureStatus = document.getElementById('gestureStatus');
    const ctx = canvas.getContext('2d');

    let isTwoFingers = false;

    function getDistance(p1, p2) {
      return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
    }

    
    function isTwoFingersGesture(landmarks) {
      const wrist = landmarks[0];

      
      const indexTipDist = getDistance(landmarks[8], wrist);   
      const middleTipDist = getDistance(landmarks[12], wrist); 
      const ringTipDist = getDistance(landmarks[16], wrist);   
      const pinkyTipDist = getDistance(landmarks[20], wrist);  

      
      const indexBaseDist = getDistance(landmarks[5], wrist);
      const middleBaseDist = getDistance(landmarks[9], wrist);
      const ringBaseDist = getDistance(landmarks[13], wrist);
      const pinkyBaseDist = getDistance(landmarks[17], wrist);

      
      const indexOpen = indexTipDist > indexBaseDist;
      const middleOpen = middleTipDist > middleBaseDist;

      
      const ringClosed = ringTipDist < ringBaseDist;
      const pinkyClosed = pinkyTipDist < pinkyBaseDist;

      return indexOpen && middleOpen && ringClosed && pinkyClosed;
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        if (isTwoFingersGesture(landmarks)) {
          isTwoFingers = true;
          webcam.classList.add('blurred');
          gestureStatus.textContent = "Status Tangan: 2 Jari Terdeteksi (Efek Blur Aktif)";
          gestureStatus.style.color = "#ff5252";
        } else {
          isTwoFingers = false;
          webcam.classList.remove('blurred');
          gestureStatus.textContent = "Status Tangan: Lainnya (Blur Nonaktif)";
          gestureStatus.style.color = "#69f0ae";
        }
      } else {
        isTwoFingers = false;
        webcam.classList.remove('blurred');
        gestureStatus.textContent = "Status Tangan: Tidak Terdeteksi";
        gestureStatus.style.color = "#ffca28";
      }
    });

    const camera = new Camera(webcam, {
      onFrame: async () => {
        await hands.send({ image: webcam });
      },
      width: 640,
      height: 480
    });

    camera.start();

    captureBtn.addEventListener('click', () => {
      if (webcam.videoWidth === 0 || webcam.videoHeight === 0) return;

      canvas.width = webcam.videoWidth;
      canvas.height = webcam.videoHeight;

      ctx.save();
      
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);

      if (isTwoFingers) {
        ctx.filter = 'blur(15px)';
      } else {
        ctx.filter = 'none';
      }

      ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    });
  </script>

</body>
</html>
